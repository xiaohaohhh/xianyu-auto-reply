name: 构建并发布容器镜像

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 要构建并发布的 Git 分支、标签或提交号
        required: false
        default: main
        type: string

# 默认令牌保持只读，仅授予发布 GHCR 镜像所需的权限。
permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-images-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-push:
    # 仅工作流或文档配置的提交可带 [skip-image-build] 跳过无意义的镜像重建；
    # 正常 main/dev 分支代码更新仍会自动发布各自渠道的镜像。
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip-image-build]')
    name: 构建并发布 ${{ matrix.display_name }} 镜像
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            display_name: 前端
            dockerfile: docker/frontend/Dockerfile
            image: xianyu-frontend
          - service: backend-web
            display_name: 后端 API
            dockerfile: backend-web/Dockerfile
            image: xianyu-backend-web
          - service: websocket
            display_name: WebSocket
            dockerfile: websocket/Dockerfile
            image: xianyu-websocket
          - service: scheduler
            display_name: 调度服务
            dockerfile: scheduler/Dockerfile
            image: xianyu-scheduler

    steps:
      - name: 检出源代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - name: 记录源代码版本
        id: revision
        shell: bash
        run: |
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "full_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 选择镜像发布渠道
        id: image_tags
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          SHORT_SHA: ${{ steps.revision.outputs.short_sha }}
        run: |
          case "$REF_NAME" in
            main)
              channel_tag=latest
              revision_tag="sha-${SHORT_SHA}"
              ;;
            dev)
              channel_tag=dev
              revision_tag="dev-sha-${SHORT_SHA}"
              ;;
            *)
              echo "::error::仅支持 main 或 dev 分支发布，当前分支：$REF_NAME"
              exit 1
              ;;
          esac

          {
            echo "channel_tag=$channel_tag"
            echo "revision_tag=$revision_tag"
          } >> "$GITHUB_OUTPUT"

      - name: 配置 QEMU 多架构模拟器
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub 容器镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并发布镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.image_tags.outputs.channel_tag }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.image_tags.outputs.revision_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.full_sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
