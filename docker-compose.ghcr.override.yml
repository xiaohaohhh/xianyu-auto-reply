# Combine with docker-compose.yml to run the images published by this fork.
# Keep the base file so service configuration and named volumes stay identical
# to the local-source deployment.
services:
  backend-web:
    image: ${IMAGE_REGISTRY:-ghcr.io/xiaohaohhh}/xianyu-backend-web:${IMAGE_TAG:-latest}
    pull_policy: always

  websocket:
    image: ${IMAGE_REGISTRY:-ghcr.io/xiaohaohhh}/xianyu-websocket:${IMAGE_TAG:-latest}
    pull_policy: always

  scheduler:
    image: ${IMAGE_REGISTRY:-ghcr.io/xiaohaohhh}/xianyu-scheduler:${IMAGE_TAG:-latest}
    pull_policy: always

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/xiaohaohhh}/xianyu-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    # Nginx in the cloud image listens on IPv4. `localhost` can resolve to
    # IPv6 first inside the container and cause a false-negative health check.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --tries=1 http://127.0.0.1/ || exit 1"]
